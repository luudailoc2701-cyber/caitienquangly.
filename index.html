<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lightning Matrix - Master System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0a0a0a !important; color: #fff !important; font-family: sans-serif; padding: 20px; }
        .system-container { display: flex; flex-direction: column; gap: 20px; max-width: 900px; margin: auto; }
        .panel { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .force-resize { transform: scale(1); transform-origin: top left; transition: 0.3s; }
        input { background: #333; color: #fff; border: none; padding: 5px; width: 100px; }
    </style>
</head>
<body>

<div class="system-container">
    <div class="panel">
        <h1>Lightning Matrix Dashboard</h1>
        <label>Phóng đại: <input type="range" id="zoom-slider" min="1" max="1.5" step="0.1" value="1"></label>
        <button onclick="toggleChart()">Chuyển Biểu Đồ (Cột/Tròn)</button>
        <div id="stats">Hiệu suất trung bình: <span id="avg-val">0</span></div>
    </div>

    <div id="matrix-section" class="force-resize">
        <table id="data-table" border="1"></table>
    </div>

    <div class="panel">
        <canvas id="mainChart"></canvas>
    </div>
</div>

<script>
    // 1. Cấu trúc dữ liệu & Lưu trữ (LocalStorage Manager)
    const saveData = () => {
        const inputs = Array.from(document.querySelectorAll('input[type="text"]')).map(i => i.value);
        localStorage.setItem('matrixData', JSON.stringify(inputs));
        updatePerformance();
    };

    const loadData = () => {
        const data = JSON.parse(localStorage.getItem('matrixData') || '[]');
        const inputs = document.querySelectorAll('input[type="text"]');
        data.forEach((val, i) => { if(inputs[i]) inputs[i].value = val; });
    };

    // 2. Tính toán & Hiệu ứng biểu đồ
    const updatePerformance = () => {
        const values = Array.from(document.querySelectorAll('input[type="text"]')).map(i => i.value.length * 10);
        document.getElementById('avg-val').innerText = (values.reduce((a,b)=>a+b, 0)/14).toFixed(2);
        
        if(window.chartInstance) {
            window.chartInstance.data.datasets[0].data = values;
            window.chartInstance.update();
        }
    };

    // 3. Khởi tạo hệ thống cưỡng ép
    const initSystem = () => {
        const table = document.getElementById('data-table');
        for(let i=1; i<=14; i++) {
            table.innerHTML += `<tr><td>Ngày ${i}</td><td><input type="text" oninput="saveData()"></td></tr>`;
        }
        
        window.chartInstance = new Chart(document.getElementById('mainChart'), {
            type: 'bar',
            data: { labels: Array(14).fill(0).map((_,i)=>i+1), datasets: [{ data: Array(14).fill(0), backgroundColor: '#ff4500' }] },
            options: { animation: { duration: 2000, easing: 'easeOutBounce' } }
        });
        loadData();
    };

    window.toggleChart = () => {
        const type = window.chartInstance.config.type === 'bar' ? 'pie' : 'bar';
        window.chartInstance.destroy();
        window.chartInstance = new Chart(document.getElementById('mainChart'), { type, data: window.chartInstance.data });
    };

    document.getElementById('zoom-slider').addEventListener('input', (e) => {
        document.getElementById('matrix-section').style.transform = `scale(${e.target.value})`;
    });

    initSystem();
</script>
</body>
</html>
